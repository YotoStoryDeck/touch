name: Release & Pre-Release Pipeline

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      bump:
        description: 'Semantic Version Action'
        required: true
        type: choice
        options:
          - 'current'
          - 'patch'
          - 'minor'
          - 'major'
          - 'custom'
        default: 'current'
      release_type:
        description: 'Release Classification'
        required: true
        type: choice
        options:
          - 'pre-release (RC)'
          - 'stable (Full Release)'
        default: 'pre-release (RC)'
      custom_tag:
        description: 'Custom Tag (only evaluated if bump=custom)'
        required: false
        type: string
        default: ''

permissions:
  contents: write

jobs:
  release:
    name: Build & Package Firmware
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PlatformIO Core
        run: |
          pip install --upgrade platformio

      - name: Print Build Environment & Checked-Out Ref
        run: |
          echo "GITHUB_REF: ${GITHUB_REF}"
          echo "GITHUB_REF_NAME: ${GITHUB_REF_NAME}"
          echo "GITHUB_SHA: ${GITHUB_SHA}"
          echo "=== Touch Git Repository Status ==="
          git rev-parse HEAD
          git status

      - name: Determine Tag & Release Classification
        id: meta
        run: |
          git fetch --tags --force
          python3 .github/scripts/calculate_version.py \
            --repo-dir . \
            --event "${{ github.event_name }}" \
            --ref-name "${GITHUB_REF_NAME}" \
            --bump "${{ github.event.inputs.bump }}" \
            --release-type "${{ github.event.inputs.release_type }}" \
            --custom-tag "${{ github.event.inputs.custom_tag }}"

      - name: Configure Firmware Build Seeds
        run: |
          if [ ! -f include/secrets.h ]; then
            cp include/secrets.h.example include/secrets.h
          fi

      - name: Build Waveshare ESP32-S3 Firmware
        env:
          STORYDECK_VERSION: ${{ steps.meta.outputs.tag }}
        run: |
          pio run -e waveshare-s3-43b
          mkdir -p dist
          # Copy firmware binaries
          cp .pio/build/waveshare-s3-43b/firmware.bin dist/storydeck-touch-${{ steps.meta.outputs.tag }}-firmware.bin
          cp .pio/build/waveshare-s3-43b/bootloader.bin dist/storydeck-touch-${{ steps.meta.outputs.tag }}-bootloader.bin || true
          cp .pio/build/waveshare-s3-43b/partitions.bin dist/storydeck-touch-${{ steps.meta.outputs.tag }}-partitions.bin || true

      - name: Generate Changelog & Release Notes
        id: notes
        run: |
          git fetch --tags --force

          TAG="${{ steps.meta.outputs.tag }}"
          IS_PRERELEASE="${{ steps.meta.outputs.prerelease }}"
          NOTES_FILE="release_notes.md"
          rm -f "${NOTES_FILE}"

          # Helper function to generate git log commit changelog
          generate_changelog() {
            local out="$1"
            echo "Resolving previous tag for changelog comparison..."
            if [ "${IS_PRERELEASE}" = "true" ]; then
              PREV_TAG=$(git tag --sort=-v:refname | grep -v "^${TAG}$" | head -n 1 || true)
              echo "Pre-release: Previous tag resolved to '${PREV_TAG:-none}'"
            else
              PREV_TAG=$(git tag --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | grep -v "^${TAG}$" | head -n 1 || true)
              echo "Full release: Previous stable tag resolved to '${PREV_TAG:-none}'"
            fi

            echo "## Changelog" >> "${out}"
            if [ -n "${PREV_TAG}" ]; then
              COMMITS=$(git log "${PREV_TAG}..HEAD" --pretty=format:"* %H: %s (@%an)")
              if [ -n "${COMMITS}" ]; then
                echo "${COMMITS}" >> "${out}"
              else
                echo "* Maintenance release / no commit delta" >> "${out}"
              fi
              echo "" >> "${out}"
              echo "**Full Changelog**: https://github.com/${{ github.repository }}/compare/${PREV_TAG}...${TAG}" >> "${out}"
            else
              COMMITS=$(git log --pretty=format:"* %H: %s (@%an)")
              if [ -n "${COMMITS}" ]; then
                echo "${COMMITS}" >> "${out}"
              else
                echo "* Initial release" >> "${out}"
              fi
              echo "" >> "${out}"
            fi
          }

          if [ "${IS_PRERELEASE}" = "true" ]; then
            # Pre-releases always use the warning banner + commit changelog
            cat << 'EOF' >> "${NOTES_FILE}"
> [!WARNING]
> This release is intended for testing purposes only. Please do not use it with production data, as frequent updates and architectural changes may occur between pre-release versions.

EOF
            generate_changelog "${NOTES_FILE}"
          else
            # Full releases look for release-v[tag].md in releases/ or release/ folder
            MATCHED_FILE=""
            CLEAN_VER=$(echo "${TAG}" | sed -E 's/^[[:space:]]*[vV]+//')
            for CANDIDATE in \
              "releases/release-${TAG}.md" \
              "releases/release-v${CLEAN_VER}.md" \
              "release/release-${TAG}.md" \
              "release/release-v${CLEAN_VER}.md" \
              "release-${TAG}.md" \
              "release-v${CLEAN_VER}.md"; do
              if [ -f "${CANDIDATE}" ]; then
                MATCHED_FILE="${CANDIDATE}"
                break
              fi
            done

            if [ -n "${MATCHED_FILE}" ]; then
              echo "Found matching release file for full release: ${MATCHED_FILE}"
              cat "${MATCHED_FILE}" >> "${NOTES_FILE}"
            else
              echo "No matching release file found for ${TAG}. Falling back to commit changelog."
              generate_changelog "${NOTES_FILE}"
            fi
          fi

          echo "Final release notes generated:"
          cat "${NOTES_FILE}"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: ${{ steps.meta.outputs.tag }}
          prerelease: ${{ steps.meta.outputs.prerelease == 'true' }}
          draft: false
          body_path: release_notes.md
          files: |
            dist/*

      - name: Sync Binaries & Manifests to Website Branch
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          # Clone dedicated website branch
          git clone --branch website https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git website_repo
          cd website_repo

          TAG="${{ steps.meta.outputs.tag }}"
          IS_PRERELEASE="${{ steps.meta.outputs.prerelease }}"

          if [ "$IS_PRERELEASE" = "true" ]; then
            CHANNEL="prerelease"
            MANIFEST="manifest-prerelease.json"
          else
            CHANNEL="stable"
            MANIFEST="manifest-stable.json"
          fi

          echo "Syncing ${TAG} binaries to ${CHANNEL} web installer..."
          mkdir -p bin/${CHANNEL}

          cp ../.pio/build/waveshare-s3-43b/bootloader.bin bin/${CHANNEL}/bootloader.bin
          cp ../.pio/build/waveshare-s3-43b/partitions.bin bin/${CHANNEL}/partitions.bin
          cp ~/.platformio/packages/framework-arduinoespressif32/tools/partitions/boot_app0.bin bin/${CHANNEL}/boot_app0.bin || cp bin/boot_app0.bin bin/${CHANNEL}/boot_app0.bin
          cp ../.pio/build/waveshare-s3-43b/firmware.bin bin/${CHANNEL}/firmware.bin

          # Update version field in target manifest
          if command -v jq >/dev/null 2>&1; then
            jq --arg ver "${TAG}" '.version = $ver' ${MANIFEST} > tmp.json && mv tmp.json ${MANIFEST}
            if [ "$CHANNEL" = "stable" ]; then
              jq --arg ver "${TAG}" '.version = $ver' manifest.json > tmp.json && mv tmp.json manifest.json
            fi
          fi

          git add bin/${CHANNEL}/ ${MANIFEST} manifest.json
          if git diff --staged --quiet; then
            echo "No changes detected on website branch."
          else
            git commit -m "chore(release): auto-publish ${TAG} (${CHANNEL}) to web flasher"
            git push origin website
            echo "Successfully synced ${TAG} to website branch."
          fi

