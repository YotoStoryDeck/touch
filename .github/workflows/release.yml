name: Release & Pre-Release Pipeline

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag (e.g. v1.0.0, v1.0.0-rc.1, v1.1.0-beta.1)'
        required: true
        type: string
      prerelease:
        description: 'Mark as Pre-release?'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  release:
    name: Build & Publish Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python for PlatformIO (if needed)
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Determine Tag & Release Classification
        id: meta
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag_name }}"
            IS_PRERELEASE="${{ github.event.inputs.prerelease }}"
          else
            TAG="${GITHUB_REF_NAME}"
            if [[ "$TAG" == *-* ]]; then
              IS_PRERELEASE="true"
            else
              IS_PRERELEASE="false"
            fi
          fi
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          echo "prerelease=${IS_PRERELEASE}" >> $GITHUB_OUTPUT
          echo "Resolved Tag: ${TAG} (Pre-release: ${IS_PRERELEASE})"

      - name: Package Web-Touch Companion Asset Bundle
        run: |
          mkdir -p dist
          BUNDLE_NAME="storydeck-web-touch-${{ steps.meta.outputs.tag }}.tar.gz"
          tar -czf "dist/${BUNDLE_NAME}" -C web-touch .
          echo "Created web-touch distribution archive: dist/${BUNDLE_NAME}"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: StoryDeck Touch ${{ steps.meta.outputs.tag }}
          prerelease: ${{ steps.meta.outputs.prerelease == 'true' }}
          draft: false
          generate_release_notes: true
          files: |
            dist/*

