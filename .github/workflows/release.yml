name: Release & Pre-Release Pipeline

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag (e.g. v1.0.0, v1.0.0-rc.1, v1.1.0-beta.1)'
        required: true
        type: string
      prerelease:
        description: 'Mark as Pre-release?'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  release:
    name: Build & Package Firmware
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PlatformIO Core
        run: |
          pip install --upgrade platformio

      - name: Print Build Environment & Checked-Out Ref
        run: |
          echo "GITHUB_REF: ${GITHUB_REF}"
          echo "GITHUB_REF_NAME: ${GITHUB_REF_NAME}"
          echo "GITHUB_SHA: ${GITHUB_SHA}"
          echo "=== Touch Git Repository Status ==="
          git rev-parse HEAD
          git status

      - name: Determine Tag & Release Classification
        id: meta
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag_name }}"
            IS_PRERELEASE="${{ github.event.inputs.prerelease }}"
          else
            TAG="${GITHUB_REF_NAME}"
            if [[ "$TAG" == *-* ]]; then
              IS_PRERELEASE="true"
            else
              IS_PRERELEASE="false"
            fi
          fi
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          echo "prerelease=${IS_PRERELEASE}" >> $GITHUB_OUTPUT
          echo "Resolved Tag: ${TAG} (Pre-release: ${IS_PRERELEASE})"

      - name: Configure Firmware Build Seeds
        run: |
          if [ ! -f include/secrets.h ]; then
            cp include/secrets.h.example include/secrets.h
          fi

      - name: Build Waveshare ESP32-S3 Firmware
        run: |
          pio run -e waveshare-s3-43b
          mkdir -p dist
          # Copy firmware binaries
          cp .pio/build/waveshare-s3-43b/firmware.bin dist/storydeck-touch-${{ steps.meta.outputs.tag }}-firmware.bin
          cp .pio/build/waveshare-s3-43b/bootloader.bin dist/storydeck-touch-${{ steps.meta.outputs.tag }}-bootloader.bin || true
          cp .pio/build/waveshare-s3-43b/partitions.bin dist/storydeck-touch-${{ steps.meta.outputs.tag }}-partitions.bin || true

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: StoryDeck Touch ${{ steps.meta.outputs.tag }}
          prerelease: ${{ steps.meta.outputs.prerelease == 'true' }}
          draft: false
          generate_release_notes: true
          files: |
            dist/*

      - name: Sync Binaries & Manifests to Website Branch
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          # Clone dedicated website branch
          git clone --branch website https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git website_repo
          cd website_repo

          TAG="${{ steps.meta.outputs.tag }}"
          IS_PRERELEASE="${{ steps.meta.outputs.prerelease }}"

          if [ "$IS_PRERELEASE" = "true" ]; then
            CHANNEL="prerelease"
            MANIFEST="manifest-prerelease.json"
          else
            CHANNEL="stable"
            MANIFEST="manifest-stable.json"
          fi

          echo "Syncing ${TAG} binaries to ${CHANNEL} web installer..."
          mkdir -p bin/${CHANNEL}

          cp ../.pio/build/waveshare-s3-43b/bootloader.bin bin/${CHANNEL}/bootloader.bin
          cp ../.pio/build/waveshare-s3-43b/partitions.bin bin/${CHANNEL}/partitions.bin
          cp ~/.platformio/packages/framework-arduinoespressif32/tools/partitions/boot_app0.bin bin/${CHANNEL}/boot_app0.bin || cp bin/boot_app0.bin bin/${CHANNEL}/boot_app0.bin
          cp ../.pio/build/waveshare-s3-43b/firmware.bin bin/${CHANNEL}/firmware.bin

          # Update version field in target manifest
          if command -v jq >/dev/null 2>&1; then
            jq --arg ver "${TAG}" '.version = $ver' ${MANIFEST} > tmp.json && mv tmp.json ${MANIFEST}
            if [ "$CHANNEL" = "stable" ]; then
              jq --arg ver "${TAG}" '.version = $ver' manifest.json > tmp.json && mv tmp.json manifest.json
            fi
          fi

          git add bin/${CHANNEL}/ ${MANIFEST} manifest.json
          if git diff --staged --quiet; then
            echo "No changes detected on website branch."
          else
            git commit -m "chore(release): auto-publish ${TAG} (${CHANNEL}) to web flasher"
            git push origin website
            echo "Successfully synced ${TAG} to website branch."
          fi

