; StoryDeck Touch — PlatformIO Build Configuration
[platformio]
default_envs = waveshare-s3-43b

; ==============================================================================
; Environment 1: Physical Waveshare ESP32-S3-Touch-LCD-4.3B (Rev 1.1)
; ==============================================================================
[env:waveshare-s3-43b]
build_src_filter = +<main.cpp>
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.39/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
board_build.flash_size = 16MB
board_build.flash_mode = qio
board_upload.flash_size = 16MB
board_build.arduino.memory_type = qio_opi
board_build.partitions = default_16MB.csv
build_flags = 
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DLV_CONF_INCLUDE_SIMPLE
    -DELEGANTOTA_USE_ASYNC_WEBSERVER=0
    '-DSTORYDECK_VERSION="${sysenv.STORYDECK_VERSION}"'
    -I include
lib_deps = 
    lvgl/lvgl@^8.3.0
    bblanchon/ArduinoJson@^7
    kikuchan98/pngle@^1.1.0
    bitbank2/JPEGDEC@^1.8.0
    ayushsharma82/ElegantOTA@^3.1.0
monitor_speed = 115200
upload_speed = 921600

; ==============================================================================
; Environment 2: Wireless OTA Flash for Physical Board
; ==============================================================================
[env:waveshare-s3-43b-ota]
extends = env:waveshare-s3-43b
upload_protocol = espota
upload_port = yoto-controller.local

; ==============================================================================
; Environment 3: Wokwi Simulator (Full ESP32-S3 + 8MB PSRAM + LVGL App)
; ==============================================================================
[env:wokwi]
extends = env:waveshare-s3-43b
build_flags = 
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DLV_CONF_INCLUDE_SIMPLE
    -DELEGANTOTA_USE_ASYNC_WEBSERVER=0
    '-DSTORYDECK_VERSION="${sysenv.STORYDECK_VERSION}"'
    -DWOKWI_SIMULATION=1
    '-DWOKWI_CORE_URL="http://host.wokwi.internal:5055"'
    -I include
