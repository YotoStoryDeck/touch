[platformio]
default_envs = wokwi

; ==============================================================================
; Environment 1: Wokwi Simulator Virtual Bench (SPI LCD + Touch + RFID)
; ==============================================================================
[env:wokwi]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
build_type = debug

build_flags = 
    -D CORE_DEBUG_LEVEL=3
    -D WOKWI_SIMULATION=1
    -D LV_CONF_INCLUDE_SIMPLE=1
    -D TFT_MISO=19
    -D TFT_MOSI=23
    -D TFT_SCLK=18
    -D TFT_CS=15
    -D TFT_DC=2
    -D TFT_RST=4
    -D TOUCH_CS=21
    -I include

build_src_filter = +<wokwi_sim.cpp>

lib_deps = 
    bblanchon/ArduinoJson@^7.0.4
    miguelbalboa/MFRC522@^1.4.11
    bodmer/TFT_eSPI@^2.5.43
    lvgl/lvgl@^8.3.11
    bitbank2/JPEGDEC@^1.8.0

; ==============================================================================
; Environment 2: Physical Waveshare ESP32-S3-Touch-LCD-4.3B (Rev 1.1)
; ==============================================================================
[env:waveshare-s3-43b]
build_src_filter = +<main.cpp>
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.39/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
board_build.flash_size = 16MB
board_build.flash_mode = qio
board_upload.flash_size = 16MB
board_build.arduino.memory_type = qio_opi
board_build.partitions = default_16MB.csv
build_flags = 
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DLV_CONF_INCLUDE_SIMPLE
    -DELEGANTOTA_USE_ASYNC_WEBSERVER=0
    -I include
lib_deps = 
    lvgl/lvgl@^8.3.0
    bblanchon/ArduinoJson@^7
    kikuchan98/pngle@^1.1.0
    bitbank2/JPEGDEC@^1.8.0
    ayushsharma82/ElegantOTA@^3.1.0
monitor_speed = 115200
upload_speed = 921600

; ==============================================================================
; Environment 3: Wireless OTA Flash for Physical Board
; ==============================================================================
[env:waveshare-s3-43b-ota]
extends = env:waveshare-s3-43b
upload_protocol = espota
upload_port = yoto-controller.local